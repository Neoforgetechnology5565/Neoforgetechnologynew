<!doctype html>
<html><head><meta charset="utf-8"><style>
:root{--g:#1dbf73}
body{font:13px system-ui,sans-serif;margin:0;padding:12px;color:#222}
header{display:flex;justify-content:space-between;align-items:center}
h1{font-size:16px;margin:0;color:var(--g)}
label{display:block;margin:10px 0 3px;font-weight:600}
input,textarea{width:100%;box-sizing:border-box;padding:7px;border:1px solid #ccc;border-radius:5px;font:inherit}
button{margin-top:10px;padding:8px 12px;background:var(--g);color:#fff;border:0;border-radius:5px;cursor:pointer;font-weight:600;width:100%}
button.secondary{background:#555}button.ghost{background:none;color:#555;width:auto;margin:0;font-size:16px}
button:disabled{opacity:.5;cursor:not-allowed}
#tabs{display:flex;gap:4px;margin:10px 0}#tabs button{margin:0;padding:6px 2px;font-size:11px;background:#eee;color:#333}#tabs button.on{background:var(--g);color:#fff}
.row{display:flex;gap:8px}.row>div,.row>button{flex:1}
.choices label{display:block;border:1px solid #ddd;border-radius:6px;padding:8px;margin:6px 0;font-weight:400;cursor:pointer}
.choices label:has(input:checked){border-color:var(--g);background:#effaf4}
.choices input{width:auto;margin-right:6px}
.choices small{display:block;color:#555;margin-top:4px;white-space:pre-line}
#preview{width:100%;margin-top:10px;border-radius:6px}
#status{margin-top:10px;color:#b00;min-height:16px}#status.ok{color:#117a45}
.hint{color:#777;font-size:11px}span{font-weight:400;color:#777}

</style></head>
<body>
<header><h1>Fiverr Gig Writer</h1><button id="gear" class="ghost" title="Settings">⚙</button></header>

<section id="settings" hidden>
  <label>Google AI (Gemini) API key — free at aistudio.google.com</label><input id="geminiKey" type="password" placeholder="AIza...">
  <label>Writing model</label><input id="textModel" placeholder="gemini-2.5-flash">
  <label>Image model (optional, may be paid)</label><input id="imageModel" placeholder="imagen-4.0-generate-001">
  <button id="saveSettings">Save</button>
  <p class="hint">Key stays in this browser and goes only to Google.</p>
</section>

<nav id="tabs">
  <button data-step="1" class="on">1 Overview</button><button data-step="2">2 Pricing</button><button data-step="3">3 Description</button><button data-step="4">4 Requirements</button><button data-step="5">5 Gallery</button>
</nav>

<div id="s1" class="step">
  <label>Your 5 keywords (comma separated). They become the gig tags.</label>
  <input id="keywords" placeholder="logo design, brand identity, minimalist logo, ...">
  <label>Anything else I should know (optional)</label>
  <input id="notes" placeholder="e.g. I focus on startups">
  <button id="genTitles">Suggest 5 titles</button>
  <div id="titles" class="choices"></div>
  <button id="fillOverview" disabled>Fill title, tags &amp; categories on page</button>
</div>

<div id="s2" class="step" hidden>
  <label>Scope: what you'll deliver</label>
  <textarea id="scope" rows="3" placeholder="e.g. logo + 3 concepts, source files, social media kit"></textarea>
  <div class="row"><div><label>Delivery idea</label><input id="days" placeholder="e.g. 2 / 4 / 7 days"></div>
  <div><label>Budget range</label><input id="budget" placeholder="e.g. $20 - $150"></div></div>
  <button id="genPricing">Suggest pricing</button>
  <div id="pricing" class="choices"></div>
  <button id="fillPricing" disabled>Fill pricing on page</button>
</div>

<div id="s3" class="step" hidden>
  <label>How should the description sound? (optional)</label>
  <input id="style" placeholder="e.g. short, friendly, no jargon, mention fast replies">
  <button id="genDesc">Write description</button>
  <label>Description <span id="dlen"></span></label>
  <textarea id="desc" rows="12"></textarea>
  <button id="fillDesc" disabled>Fill description on page</button>
</div>

<div id="s4" class="step" hidden>
  <button id="genReq">Write requirements</button>
  <label>Questions for the buyer (one per line)</label>
  <textarea id="req" rows="8"></textarea>
  <button id="fillReq" disabled>Fill requirements on page</button>
</div>

<div id="s5" class="step" hidden>
  <label>Image style (optional)</label>
  <input id="imgStyle" placeholder="e.g. dark neon, flat illustration, photo-real">
  <button id="genPrompt">Write image prompt (free)</button>
  <textarea id="imgPrompt" rows="5" placeholder="Prompt appears here. Paste it into Google Flow / Gemini, then drag the image into Fiverr."></textarea>
  <button id="copyPrompt" class="secondary">Copy prompt</button>
  <button id="genImg" class="secondary">Or generate it here with Google API (may cost)</button>
  <img id="preview" hidden>
  <div class="row"><button id="uploadImg" disabled>Upload to Fiverr</button><button id="dlImg" class="secondary" disabled>Download</button></div>
</div>

<div id="status"></div>
<p class="hint">You click Fiverr's Next/Save yourself on every page. Always check what was filled before publishing.</p>
<button id="scan" class="secondary">Scan page (for troubleshooting)</button>
<script src="sidepanel.js"></script>
</body></html>
